<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard ♡ luvselrispremium</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --deep-pink: #f472b6;
      --deep-blue: #38bdf8;
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-color: #fbcfe8;
      --text: #3b354d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', 'Mitr', sans-serif; }
    body {
      background: radial-gradient(circle at top, #e0f2fe 0%, #fdf2f8 50%, #ede9fe 100%);
      color: var(--text); min-height: 100vh; padding: 20px 14px 60px; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 480px; }
    .card {
      background: var(--card-bg); border-radius: 24px; padding: 20px;
      box-shadow: 0 10px 25px rgba(244, 114, 182, 0.15); border: 1.5px solid #fff; margin-bottom: 16px;
    }
    .title { font-size: 18px; font-weight: 700; color: var(--deep-pink); text-align: center; margin-bottom: 14px; }
    .field-group { margin-bottom: 12px; }
    .field-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: block; }
    .input-box, .textarea-box {
      width: 100%; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--border-color);
      outline: none; font-size: 13.5px; background: #fff;
    }
    .input-box:focus, .textarea-box:focus { border-color: var(--deep-blue); }
    .textarea-box { min-height: 70px; resize: vertical; }

    .nav-tabs {
      display: flex; gap: 6px; margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1; padding: 9px 0; border: none; border-radius: 16px;
      background: #ffffff; color: var(--text); font-weight: 600; cursor: pointer;
      border: 1px solid var(--border-color); font-size: 13px;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--deep-pink), var(--deep-blue));
      color: #fff; border-color: transparent;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .app-admin-card {
      background: #fff; border: 1.5px solid var(--border-color); border-radius: 18px;
      padding: 14px; margin-bottom: 12px;
    }
    .plan-stock-card {
      background: #fdf2f8; border: 1px dashed var(--deep-pink); border-radius: 12px;
      padding: 10px; margin-top: 8px;
    }

    .btn {
      width: 100%; padding: 12px; border-radius: 18px; border: none; font-size: 14.5px;
      font-weight: 700; cursor: pointer; background: linear-gradient(135deg, var(--deep-pink), var(--deep-blue));
      color: #fff; box-shadow: 0 4px 14px rgba(244, 114, 182, 0.3); margin-top: 8px;
    }
    .btn-secondary {
      background: #fff; color: var(--deep-pink); border: 1.5px solid var(--border-color); box-shadow: none;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- ล็อกอิน -->
  <div class="card" id="loginBox">
    <div class="title">🔐 ระบบหลังบ้าน ♡ luvselrispremium</div>
    <div class="field-group">
      <label class="field-label">อีเมลแอดมิน</label>
      <input type="email" id="loginEmail" class="input-box" placeholder="srezinalm@gmail.com">
    </div>
    <div class="field-group">
      <label class="field-label">รหัสผ่าน</label>
      <input type="password" id="loginPassword" class="input-box" placeholder="กรอกรหัสผ่าน">
    </div>
    <button type="button" class="btn" onclick="handleLogin()">เข้าสู่ระบบแอดมิน</button>
  </div>

  <!-- แผงแดชบอร์ด -->
  <div id="dashboardBox" class="hidden">
    <div class="nav-tabs">
      <button type="button" class="tab-btn active" onclick="switchAdminTab('general')">1. ร้านค้า</button>
      <button type="button" class="tab-btn" onclick="switchAdminTab('apps')">2. แอพ & สต็อก</button>
      <button type="button" class="tab-btn" onclick="switchAdminTab('account')">3. บัญชี & รหัส</button>
    </div>

    <!-- แถบ 1: แก้ไขโปรไฟล์ร้าน -->
    <div class="tab-content active" id="tab-general">
      <div class="card">
        <div class="title">🌸 ข้อมูลโปรไฟล์ร้าน</div>
        <div class="field-group">
          <label class="field-label">ชื่อร้าน</label>
          <input type="text" id="cfgShopName" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">คำอธิบายร้าน (Bio)</label>
          <textarea id="cfgShopBio" class="textarea-box"></textarea>
        </div>
        <div class="field-group">
          <label class="field-label">URL รูปแบนเนอร์ (GIF/JPG)</label>
          <input type="text" id="cfgBanner" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">URL รูปโปรไฟล์</label>
          <input type="text" id="cfgProfile" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">URL LINE Officials</label>
          <input type="text" id="cfgLineOa" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">URL เพลง (.mp3)</label>
          <input type="text" id="cfgMusic" class="input-box">
        </div>
        <button type="button" class="btn" onclick="saveGeneralConfig()">บันทึกข้อมูลหน้าร้าน</button>
      </div>
    </div>

    <!-- แถบ 2: จัดการแอพพรีเมียม & เติมสต็อกรหัส -->
    <div class="tab-content" id="tab-apps">
      <div class="card">
        <div class="title">📱 จัดการกล่องแอพ & เติมรหัสสต็อก</div>
        <div id="appsListContainer"></div>
        <button type="button" class="btn btn-secondary" onclick="addNewAppBox()">+ เพิ่มกล่องแอพพรีเมี่ยมใหม่</button>
        <button type="button" class="btn" onclick="saveAllApps()">บันทึกรายการแอพ & สต็อกทั้งหมด</button>
      </div>
    </div>

    <!-- แถบ 3: เปลี่ยนรหัสผ่านแอดมิน -->
    <div class="tab-content" id="tab-account">
      <div class="card">
        <div class="title">🔑 เปลี่ยนรหัสผ่านแอดมิน</div>
        <div class="field-group">
          <label class="field-label">รหัสผ่านใหม่</label>
          <input type="password" id="newAdminPass" class="input-box" placeholder="ปล่อยว่างหากไม่เปลี่ยน">
        </div>
        <button type="button" class="btn" onclick="updateAdminPass()">บันทึกรหัสผ่านใหม่</button>
        <button type="button" class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
      </div>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
    authDomain: "benefitie.firebaseapp.com",
    projectId: "benefitie",
    storageBucket: "benefitie.firebasestorage.app",
    messagingSenderId: "270365672215",
    appId: "1:270365672215:web:230d1491091e26ce83ed52"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let adminEmail = "srezinalm@gmail.com";
  let adminPass = "@Natthanan2911";
  let appsEditData = [];

  db.collection("luvselris_site").doc("admin").onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.email) adminEmail = d.email;
      if (d.pass) adminPass = d.pass;
    }
  });

  function handleLogin() {
    const e = document.getElementById('loginEmail').value.trim();
    const p = document.getElementById('loginPassword').value.trim();
    if (e === adminEmail && p === adminPass) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashboardBox').classList.remove('hidden');
      loadAllAdminData();
    } else {
      alert('อีเมลหรือรหัสผ่านแอดมินไม่ถูกต้องค่ะ');
    }
  }

  function switchAdminTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  function loadAllAdminData() {
    // 1. โหลดข้อมูลร้าน
    db.collection("luvselris_site").doc("config").get().then(doc => {
      const d = doc.exists ? doc.data() : {};
      document.getElementById('cfgShopName').value = d.shopName || "luvselrispremium ♡";
      document.getElementById('cfgShopBio').value = d.shopBio || `ยินดีต้อนรับเข้าสู่ร้าน luvselris ♡\nเชิญเลือกดูแอพพรีเมี่ยมก่อนได้เลยนะคะ มีปัญหาตรงไหนทักไลน์ @861pblyp`;
      document.getElementById('cfgBanner').value = d.bannerImg || "https://files.catbox.moe/3y894z.gif";
      document.getElementById('cfgProfile').value = d.profileImg || "https://files.catbox.moe/r28bpo.jpeg";
      document.getElementById('cfgLineOa').value = d.lineOaUrl || "https://lin.ee/t0MNqJV";
      document.getElementById('cfgMusic').value = d.musicUrl || "https://file.garden/asG8Gt-rqWIpi3II/%E0%B8%A2%E0%B8%B4%E0%B8%99%E0%B8%94%E0%B8%B5%20Ost.%E0%B8%A1%E0%B8%B2%E0%B8%95%E0%B8%B2%E0%B8%A5%E0%B8%94%E0%B8%B2%20sarah%20salola%20Official%20MV.mp3";
    });

    // 2. โหลดแอพทั้งหมด
    db.collection("luvselris_apps").orderBy("order", "asc").get().then(snap => {
      if (!snap.empty) {
        appsEditData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      } else {
        // ค่าเริ่มต้น 5 แอพ
        appsEditData = [
          {
            name: "netflix",
            thumb: "https://files.catbox.moe/kszmeo.jpeg",
            desc: "โดนปิดไม่รับเคลมถ้าไม่ซื้อแบบเคลม ♡",
            order: 0,
            plans: [
              { name: "1 day", price: 10, stock: [] },
              { name: "1 day เคลม", price: 15, stock: [] },
              { name: "7 day", price: 35, stock: [] },
              { name: "7 day เคลม", price: 40, stock: [] },
              { name: "30 day", price: 105, stock: [] },
              { name: "30 day เคลม", price: 110, stock: [] }
            ]
          },
          {
            name: "youtube",
            thumb: "https://files.catbox.moe/o8wqpz.jpeg",
            desc: "",
            order: 1,
            plans: [
              { name: "30 d ไม่ต่อเมล", price: 20, stock: [] },
              { name: "30 d เคลม", price: 25, stock: [] }
            ]
          },
          {
            name: "youtube ( mail shop )",
            thumb: "https://files.catbox.moe/o8wqpz.jpeg",
            desc: "",
            order: 2,
            plans: [
              { name: "30 d", price: 25, stock: [] },
              { name: "30 d เคลม", price: 30, stock: [] }
            ]
          },
          {
            name: "spotify",
            thumb: "https://files.catbox.moe/c7sg6u.jpeg",
            desc: "",
            order: 3,
            plans: [
              { name: "30 d ( เมลลูกค้า )", price: 55, stock: [] },
              { name: "30 d ( เมลร้าน )", price: 65, stock: [] },
              { name: "90 d ( เมลลูกค้า )", price: 160, stock: [] },
              { name: "90 d ( เมลร้าน )", price: 180, stock: [] }
            ]
          },
          {
            name: "iqiyi",
            thumb: "https://files.catbox.moe/73rqkq.jpeg",
            desc: "",
            order: 4,
            plans: [
              { name: "หาร 4 7 d", price: 15, stock: [] },
              { name: "หาร 4 30 d", price: 25, stock: [] },
              { name: "หาร 2 7 d", price: 25, stock: [] },
              { name: "หาร 2 30 d", price: 50, stock: [] },
              { name: "แอคส่วนตัว", price: 90, stock: [] }
            ]
          }
        ];
      }
      renderAppsEditor();
    });
  }

  function renderAppsEditor() {
    const box = document.getElementById('appsListContainer');
    box.innerHTML = '';

    appsEditData.forEach((app, aIdx) => {
      const card = document.createElement('div');
      card.className = 'app-admin-card';

      let plansHtml = '';
      (app.plans || []).forEach((p, pIdx) => {
        const stockStr = (p.stock || []).join('\n');
        plansHtml += `
          <div class="plan-stock-card">
            <div style="display:flex; gap:6px; margin-bottom:4px;">
              <input type="text" class="input-box" value="${p.name}" style="flex:2;" placeholder="ชื่อแพ็กเกจ" oninput="appsEditData[${aIdx}].plans[${pIdx}].name=this.value">
              <input type="number" class="input-box" value="${p.price}" style="flex:1;" placeholder="ราคา (฿)" oninput="appsEditData[${aIdx}].plans[${pIdx}].price=parseFloat(this.value)||0">
              <button type="button" style="background:#fee2e2; border:none; color:#ef4444; border-radius:10px; padding:0 8px;" onclick="removePlan(${aIdx}, ${pIdx})">✕</button>
            </div>
            <label style="font-size:11.5px; color:#475569; font-weight:600;">กล่องเติมรหัสสต็อก (แยก 1 บรรทัด = 1 รหัส):</label>
            <textarea class="textarea-box" style="font-size:12px; font-family:monospace;" placeholder="ใส่รหัสแอพที่นี่..." oninput="updateStock(${aIdx}, ${pIdx}, this.value)">${stockStr}</textarea>
            <div style="font-size:11px; color:#64748b; margin-top:2px;">คงเหลือในสต็อก: ${(p.stock || []).length} ชิ้น</div>
          </div>
        `;
      });

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong style="color:var(--deep-pink);">กล่องแอพที่ ${aIdx+1}</strong>
          <button type="button" style="background:#fee2e2; border:none; color:#ef4444; border-radius:10px; padding:4px 8px; font-size:12px;" onclick="deleteApp(${aIdx})">ลบแอพนี้</button>
        </div>
        <div class="field-group">
          <label class="field-label">ชื่อแอพ</label>
          <input type="text" class="input-box" value="${app.name}" oninput="appsEditData[${aIdx}].name=this.value">
        </div>
        <div class="field-group">
          <label class="field-label">URL รูปปกแอพ</label>
          <input type="text" class="input-box" value="${app.thumb}" oninput="appsEditData[${aIdx}].thumb=this.value">
        </div>
        <div class="field-group">
          <label class="field-label">คำอธิบายเมื่อกดเข้าไป</label>
          <input type="text" class="input-box" value="${app.desc || ''}" oninput="appsEditData[${aIdx}].desc=this.value">
        </div>
        
        <label class="field-label" style="margin-top:10px;">📦 แพ็กเกจ & สต็อกรหัส:</label>
        ${plansHtml}
        <button type="button" class="btn btn-secondary" style="padding:8px; font-size:12px; margin-top:8px;" onclick="addPlanToApp(${aIdx})">+ เพิ่มแพ็กเกจย่อย</button>
      `;
      box.appendChild(card);
    });
  }

  function updateStock(aIdx, pIdx, text) {
    const lines = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    appsEditData[aIdx].plans[pIdx].stock = lines;
  }

  function addPlanToApp(aIdx) {
    appsEditData[aIdx].plans.push({ name: "แพ็กเกจใหม่", price: 10, stock: [] });
    renderAppsEditor();
  }

  function removePlan(aIdx, pIdx) {
    appsEditData[aIdx].plans.splice(pIdx, 1);
    renderAppsEditor();
  }

  function addNewAppBox() {
    appsEditData.push({
      name: "แอพใหม่",
      thumb: "https://files.catbox.moe/kszmeo.jpeg",
      desc: "",
      order: appsEditData.length,
      plans: [{ name: "30 day", price: 50, stock: [] }]
    });
    renderAppsEditor();
  }

  function deleteApp(aIdx) {
    if (confirm("ต้องการลบกล่องแอพนี้ใช่ไหมคะ?")) {
      appsEditData.splice(aIdx, 1);
      renderAppsEditor();
    }
  }

  async function saveGeneralConfig() {
    const payload = {
      shopName: document.getElementById('cfgShopName').value.trim(),
      shopBio: document.getElementById('cfgShopBio').value.trim(),
      bannerImg: document.getElementById('cfgBanner').value.trim(),
      profileImg: document.getElementById('cfgProfile').value.trim(),
      lineOaUrl: document.getElementById('cfgLineOa').value.trim(),
      musicUrl: document.getElementById('cfgMusic').value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection("luvselris_site").doc("config").set(payload, { merge: true });
    alert("บันทึกข้อมูลหน้าร้านเรียบร้อยแล้วค่ะ ♡");
  }

  async function saveAllApps() {
    const batch = db.batch();
    
    // ลบเก่าออกแล้วเขียนใหม่เพื่อความเป็นระเบียบ
    const snap = await db.collection("luvselris_apps").get();
    snap.docs.forEach(d => batch.delete(d.ref));

    appsEditData.forEach((app, idx) => {
      const ref = db.collection("luvselris_apps").doc(`app_${idx}`);
      batch.set(ref, {
        name: app.name,
        thumb: app.thumb,
        desc: app.desc || "",
        order: idx,
        plans: app.plans || []
      });
    });

    await batch.commit();
    alert("บันทึกรายการแอพและสต็อกทั้งหมดขึ้นระบบเรียบร้อยแล้วค่ะ ♡");
  }

  async function updateAdminPass() {
    const np = document.getElementById('newAdminPass').value.trim();
    if (!np) return alert("กรุณากรอกรหัสผ่านใหม่");
    await db.collection("luvselris_site").doc("admin").set({ email: adminEmail, pass: np }, { merge: true });
    adminPass = np;
    document.getElementById('newAdminPass').value = '';
    alert("เปลี่ยนรหัสผ่านแอดมินเรียบร้อยแล้วค่ะ ♡");
  }

  function logout() {
    document.getElementById('dashboardBox').classList.add('hidden');
    document.getElementById('loginBox').classList.remove('hidden');
    document.getElementById('loginPassword').value = '';
  }
</script>
</body>
</html>
